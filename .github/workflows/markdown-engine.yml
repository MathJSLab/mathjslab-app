name: Markdown engine

on:
  push:
    paths:
      - 'src/**'
      - 'test/**'
      - 'doc/**'
      - 'script/**'
      - 'example/**'
      - 'jest.config.cjs'
      - 'tsconfig*.json'
      - 'eleventy.build.*'
      - 'webpack.config.ts'
      - 'webpack.markdown-test-worker.config.ts'
      - 'playwright.config.ts'
      - 'webpack.markdown.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/markdown-engine.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - 'doc/**'
      - 'script/**'
      - 'example/**'
      - 'jest.config.cjs'
      - 'tsconfig*.json'
      - 'eleventy.build.*'
      - 'webpack.config.ts'
      - 'webpack.markdown-test-worker.config.ts'
      - 'playwright.config.ts'
      - 'webpack.markdown.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/markdown-engine.yml'
  workflow_dispatch:

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      MARKDOWN_BROWSER_PROJECTS: all
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Check types and run application unit tests
        run: npm test
      - name: Build browser test bundles and application
        run: npm run build:test-browser
      - name: Measure optional chunks
        run: npm run measure:markdown
      - name: Run browser compatibility matrix
        run: npx playwright test --workers=1
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: markdown-playwright-diagnostics
          path: |
            playwright-report
            test/result/playwright
          if-no-files-found: ignore
