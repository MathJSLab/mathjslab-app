<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>MathJSLab Worker fixture</title>
    </head>
    <body>
        <script type="module">
            // Static dependencies participate in navigation's load boundary.
            // A top-level dynamic import can leave an empty fixture after load.
            import { createBrowserMathJSLabWorkerExecutor, createEducationalMarkdownEngine, mathJSLabExtension } from '/dist/markdown-document/markdown-document.js';
            const effects = [];
            const workers = [];
            const effectObservers = new Set();
            let workerCount = 0;
            const executor = createBrowserMathJSLabWorkerExecutor({
                toMathML: (source, display) => `<math display="${display}"><mtext>${source}</mtext></math>`,
                workerFactory: () => {
                    workerCount++;
                    const worker = new Worker('/dist/markdown-test-worker/mathjslab-worker.js', { type: 'module', name: 'mathjslab-markdown-test' });
                    workers.push(worker);
                    worker.addEventListener('message', ({ data }) => {
                        if (data.type === 'effect-request') {
                            effects.push(data.effect);
                            for (const observe of effectObservers) observe(data.effect);
                        }
                    });
                    return worker;
                },
                plotRenderer: {
                    render(container, request) {
                        const plot = document.createElement('div');
                        plot.className = 'plot-container';
                        plot.dataset.plotType = request.type;
                        plot.dataset.request = JSON.stringify(request);
                        plot.style.height = '1px';
                        container.append(plot);
                    },
                },
            });
            const engine = createEducationalMarkdownEngine({ extensions: [mathJSLabExtension(executor)] });
            const viewer = document.createElement('markdown-document');
            viewer.engine = engine;
            viewer.markdown = `# Worker lesson

\`\`\`mathjslab
x = 41
\`\`\`

\`\`\`mathjslab
x + 1
\`\`\`

\`\`\`mathjslab
plot([1, 4, 2, 5])
\`\`\``;
            document.body.append(viewer);
            window.mathJSLabWorkerTest = {
                executor,
                effects,
                nextEffect() {
                    return new Promise((resolve) => {
                        const observe = (effect) => {
                            effectObservers.delete(observe);
                            resolve(effect);
                        };
                        effectObservers.add(observe);
                    });
                },
                async probe() {
                    const worker = workers.at(-1);
                    return new Promise((resolve) => {
                        const receive = ({ data }) => {
                            if (data.type !== 'test-context-result') return;
                            worker.removeEventListener('message', receive);
                            resolve(data);
                        };
                        worker.addEventListener('message', receive);
                        worker.postMessage({ type: 'test-context-probe' });
                    });
                },
                get workerCount() {
                    return workerCount;
                },
                async serialize(result) {
                    const outputs = [];
                    for (const output of result.outputs ?? []) {
                        if (output.type === 'node') {
                            await output.mount?.(output.node);
                            outputs.push({ type: 'plot', request: JSON.parse(output.node.querySelector('.plot-container').dataset.request) });
                        } else outputs.push(output);
                    }
                    return { status: result.status, outputs, error: result.error?.message };
                },
                viewer,
                async timeoutAndRecover() {
                    const session = await executor.createSession({});
                    await session.execute('x = 0', { blockIndex: 0, statementIndex: 0 });
                    let timeout;
                    try {
                        await session.execute('while 1\nx = x + 1\nendwhile', {
                            blockIndex: 0,
                            statementIndex: 0,
                            executionPolicy: { mathjslab: { timeoutMs: 50 } },
                        });
                    } catch (error) {
                        timeout = { name: error.name, code: error.code, message: error.message };
                    }
                    const recovery = await session.execute('1 + 1', { blockIndex: 1, statementIndex: 0 });
                    await session.dispose();
                    return { timeout, recovery };
                },
                async loadRelative() {
                    const sourceUrl = new URL('/test/browser/fixtures/worker-lesson.md', location.href);
                    const session = await executor.createSession({ sourceUrl });
                    const loaded = await session.execute("load('./mathjslab-loaded.m')", { sourceUrl, blockIndex: 0, statementIndex: 0 });
                    const result = await session.execute('workerLoaded + 1', { sourceUrl, blockIndex: 1, statementIndex: 0 });
                    await session.dispose();
                    return { loaded, result };
                },
                async loadBlocked() {
                    const sourceUrl = new URL('/test/browser/fixtures/worker-lesson.md', location.href);
                    const context = { sourceUrl, resourcePolicy: { allowNetwork: false } };
                    const session = await executor.createSession(context);
                    const result = await session.execute("load('./mathjslab-loaded.m')", { ...context, blockIndex: 0, statementIndex: 0 });
                    await session.dispose();
                    return result;
                },
                async shutdown() {
                    viewer.remove();
                    await engine.dispose();
                },
            };
        </script>
    </body>
</html>
